name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    uses: groovemap-music/automation/.github/workflows/reusable-ci.yml@833cb464507678c38ab78bd4718ce697399463e9
    with:
      language: mixed
      setup-command: just setup
      check-command: just check
      coverage-command: >-
        mkdir -p coverage &&
        node --test --experimental-test-coverage
        --test-reporter=lcov
        --test-reporter-destination=coverage/lcov.info
        scripts/validate.test.mjs
      audit-command: "true"
      license-command: just license-check
      secret-scan-command: just exposure-check
      package-command: "true"
      install-command: "true"
      coverage-files: coverage/lcov.info
