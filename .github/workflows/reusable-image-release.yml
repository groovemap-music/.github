name: Reusable image release

on:
  workflow_call:
    inputs:
      image-name:
        description: Repository-aligned GHCR image name.
        required: true
        type: string
      build-context:
        description: Docker build context.
        required: false
        default: .
        type: string
      dockerfile:
        description: Dockerfile path relative to the build context.
        required: false
        default: Dockerfile
        type: string
      prepare-command:
        description: Optional command that stages private wheels in the Docker context.
        required: false
        default: ""
        type: string
      requires-private-library:
        description: Whether preparation needs the private python-libraries repository.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned repository tools
        uses: groovemap-music/.github/.github/actions/setup-tools@main

      - name: Mint private-library token
        id: app-token
        if: inputs.requires-private-library
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GROOVEMAP_CI_APP_ID }}
          private-key: ${{ secrets.GROOVEMAP_CI_APP_PRIVATE_KEY }}
          owner: groovemap-music
          repositories: python-libraries

      - name: Authorize private Git dependencies
        if: inputs.requires-private-library
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Read pinned private-library revision
        id: library
        if: inputs.requires-private-library
        shell: bash
        run: |
          revision="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          sources = data.get("tool", {}).get("uv", {}).get("sources", {})
          for source in sources.values():
              if isinstance(source, dict) and source.get("git", "").endswith("/python-libraries.git"):
                  print(source["rev"])
                  break
          else:
              raise SystemExit("no pinned python-libraries source found")
          PY
          )"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Check out pinned private library
        if: inputs.requires-private-library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: groovemap-music/python-libraries
          ref: ${{ steps.library.outputs.revision }}
          token: ${{ steps.app-token.outputs.token }}
          path: python-libraries

      - name: Configure private-library build path
        if: inputs.requires-private-library
        shell: bash
        run: |
          echo "GROOVEMAP_RUNTIME_REPO=${GITHUB_WORKSPACE}/python-libraries" >> "${GITHUB_ENV}"
          echo "GROOVEMAP_LIBRARIES_REPO=${GITHUB_WORKSPACE}/python-libraries" >> "${GITHUB_ENV}"

      - name: Install locked dependencies
        shell: bash
        run: just setup

      - name: Validate tagged source
        shell: bash
        run: just check

      - name: Prepare Docker build context
        if: inputs.prepare-command != ''
        shell: bash
        run: ${{ inputs.prepare-command }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/groovemap-music/${{ inputs.image-name }}
          tags: |
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Remove private Git credentials
        if: always() && inputs.requires-private-library
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global --remove-section "url.https://x-access-token:${APP_TOKEN}@github.com/" || true
